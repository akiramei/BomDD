      allowed_paths: [method/tools/bomdd-init.py]
    summary: >
      決めるべき論点 4 点= ①設置先(目的から言えばリポ直下でなければ core.autocrlf 継承は
      防げない)②既存 .gitattributes との衝突規則(bomdd-init の「既存は保持」思想と、
