- id: REQ-051
  statement: 'サムネイルは読み込み時に動画全体を読まず、タイムラインで見えている範囲だけを生成する: 間隔は clamp(164/pxPerSec, 0.75, 30) 秒、対象の範囲は描画範囲(左端 max(0, 横スクロール位置 − 400 px)、右端 min(全幅 + 右端の余白, 横スクロール位置 + 表示幅 + 400 px)を秒にし、右端は長さで頭打ち)で、その前後に間隔の 2 倍の余白を足して [0, 長さ] に収め、高さ 96 px・1 回の要求で最大 36 枚、要求は 180 ms まとめてから実行する。前回の要求の範囲を [S, E]・間隔を sp とすると、新しい範囲の開始 ≥ S − 間隔、終了 ≤ E + 間隔、かつ 間隔 ≥ 0.85·sp なら再要求しない。再要求するときは、bucket = max(間隔, 1) として開始を floor(開始/bucket)·bucket、終了を ceil(終了/bucket)·bucket に揃えてから要求し、その範囲と間隔を次の判定に使う。再生中も生成する。既存のキャッシュに全体のフィルムストリップがあればそれを使い、可視範囲の生成はしない。'
  rationale: VM.RequestVisibleTimelinePreview / LoadVisibleTimelineThumbnailsAsync。応答性(TTI)のための設計で、値は unit で完全一致。
  rationale_precision: ok
  classification_hint: core
  priority: should
