  statement: 分割のボタンが押せるのは、丸める前の再生ヘッドの位置の区間 r があり、再生ヘッドが開区間 (r.開始 + 0.5, r.終了 − 0.5) にあるとき。分割の実行(ボタン・S キーとも)では、分割点 ph = SnapFrame(再生ヘッド)(偶数丸め)とし、ph の位置の区間を選び直し、ph が閉区間 [その区間の開始 + 0.5, その区間の終了 − 0.5] の外なら何もしない(ph がちょうど 開始 + 0.5 なら分割する)。前半は元の ID、後半は新しい ID を持ち、両方とも速度・ピッチ維持・除外・音量を引き継ぐ。分割後は後半の区間が編集対象になる。新しい ID は読み込み時の最大 ID+1 から始まり、分割のたびに 1 増える。履歴に 1 回記録する。
