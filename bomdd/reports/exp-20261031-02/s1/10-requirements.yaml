- id: REQ-013
  statement: 'ffmpeg と ffprobe の実行ファイルは次の順に探す: 環境変数 MOVIEPAD_FFMPEG_DIR のフォルダ → アプリのフォルダの ffmpeg/ → %LOCALAPPDATA%\MoviePad\ffmpeg → アプリのフォルダ直下 → 見つからなければ実行ファイル名だけ(PATH で解決)。「ffmpeg が使える」とは、解決した 2 つのパスがどちらも実在のファイルであること。PATH の解決は判定に含まれないが、最後の段は実行ファイル名だけ(ffmpeg.exe)を返すので、カレントディレクトリに ffmpeg.exe と ffprobe.exe があると「使える」と判定される。'
  rationale: FfmpegLocator.Resolve / Available。README にも同じ順序が書かれている。探索順は unit で完全一致(各場所に置いた/置かないの組み合わせ)。
  rationale_precision: ok
  classification_hint: core
  priority: must
