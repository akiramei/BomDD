- id: REQ-011
  statement: 言語の切り替えは再起動なしに即時に反映され、表示中のすべての文字列が新しい言語で表示し直される。表示中の一時メッセージのうち、読み込みエラー・書き出し状態の「Samples cannot be exported. Open an actual file.」と「Exporting…」(通常の書き出し中は表示の条件が「書き出し中でない」なので見えず、例外で残ったときだけ見える)・ffmpeg 取得エラーの定型部分(例外メッセージはそのまま)・About の案内文は新しい言語で表示し直す。書き出しの結果の文言(「Export canceled.」「Output duration is zero.」「There are no regions to export.」と ffmpeg のエラー)は定型文でも表示したときの言語のまま残り、ライセンス全文も翻訳し直さない。数値の書式(タイムコード・速度「1.5x」・fps・リード秒数「0.0」)は言語に関わらず不変(小数点はピリオド)。
  rationale: 'Localizer.SetCulture は UI カルチャのみを変え、数値書式(CurrentCulture)は変えない。一時メッセージは翻訳元のキーを保持して言語切替時に再描画する(OnCultureChanged)。書き出しの結果は ConfirmExport が _exportStatusKey = null にして文字列をそのまま入れるので再描画されない。検査は L1: 各メッセージを出した状態で切り替え、文言が切り替わる/切り替わらないを完全一致で。'
  rationale_precision: ok
  classification_hint: core
  priority: must
  source_refs:
