- id: REQ-026
  statement: '編集対象の区間は原則として「再生ヘッドの位置の区間」(下の分割の例外を除く)で、区間を選ぶ別の操作は無い。再生ヘッドが動いてその位置の区間が変わると編集対象も変わる。ドキュメントが変わった後(分割・結合・元に戻す・やり直し・ドラッグ等)は、再生ヘッドの位置の区間があればそれ、無ければ今の編集対象がまだ存在すればそれ、それも無ければ先頭の区間を編集対象にする。例外は分割: 分割の後は後半(新しい区間)を編集対象にする。再生ヘッドは格子に乗っていないので、分割点が丸めで再生ヘッドより後ろになると、再生ヘッドは前半にいるのに編集対象は後半になる。このずれは次に再生ヘッドの値が変わるかドキュメントが変わるまで続き、その間インスペクターは後半を、速度ピルとプレビューの速度フラグ(再生ヘッドの位置の区間)は前半を表す。'
  rationale: OnPlayheadChanged と DocumentState.ResolveSelection。追従は裁定済みの契約(UQ-0017=follow-is-contract)。消えた ID が編集対象に残らないことを、結合・元に戻す・やり直しの各後で unit 完全一致。分割の例外は VM.Split の SelectedId = newId(ResyncSelection の後に上書き)と OnPlayheadChanged(再生ヘッドの値が変わったときだけ再解決)による。
  rationale_precision: ok
  classification_hint: core
  priority: must
