# 10-requirements — MoviePad の作り直しの要求(正= authority/ の元のアプリ。食い違いは実際の動作が正)
# 範囲: 全機能・全画面。除くのはプレビューの映像そのものの描画と再生のタイミングだけ。
bomdd:
  product: MoviePad
  experiment: exp-20261031-02 stage A (s1-author)
  layer: Requirements
requirements:
- id: REQ-001
  statement: '起動直後、サンプルのドキュメントが読み込み済みの状態で表示される: ファイル名 interview_raw.mp4・長さ 138 秒・1920×1080・30 fps・コーデック H.264 · AAC・実ファイルのパスは空。トリムは 6〜132 秒、区間は [6,40) 1x・[40,64) 2x・[64,104) 1x・[104,132] 0.5x(すべてピッチ維持オン・音量 100%・除外なし)。再生ヘッドは 6 秒、編集対象は区間 1、出力解像度は 1920×1080・出力 fps は 30、未編集(状態表示は「保存済み」)。'
  rationale: 実際の動作(ViewModel のコンストラクタが Sample.Doc/Sample.Clip を設定する)。説明書には記載がない。区間・トリム・数値は完全一致で検査できる(秒は浮動小数の等値)。サンプルは実ファイルを持たないので、書き出しは専用のエラーになり(書き出し節)、プレビューは実映像を読み込まず内蔵タイマーで再生ヘッドを進める。説明書・クイックスタートに記載がなく bomdd/ui には空状態の画面案があるが、正の規則(実際の動作が正)によりサンプル表示で書いた。
  rationale_precision: ok
  classification_hint: core
  priority: must
  source_refs:
  - authority/ViewModels/MainWindowViewModel.cs#MainWindowViewModel()
  - authority/Models/Sample.cs
  external_source: null
  acceptance_intent:
    depth_hint: unit
    tolerance_hint: exact
    approver_hint: automated
  trace_links:
