- id: REQ-024
  statement: '丸めの規則: 本要求群で「偶数丸め」と書く丸めは、中点(ちょうど .5)を偶数の側へ丸める(.NET の Math.Round の既定。四捨五入ではない)。書き出しの時間計算(書き出しの内容の節)の round は 0.5 を切り上げる(RoundHalfUp)ので書き分ける。分割・境界・トリムの時刻はソースの fps の格子に丸める: SnapFrame(t) = 偶数丸め(t·fps)/fps(fps が 0 以下なら 30 を使う)。区間の最小長の定数は 0.5 秒。分割は格子に丸めた後で判定するので、分割でできる区間は必ず 0.5 秒以上になる。境界の移動とトリムの移動は先に [下限, 上限](最小長 0.5 秒を残す範囲)に収めてから格子に丸めるので、丸めで下限を割り、区間が 0.5 秒より最大で半フレーム短くなることがある(例: 25 fps で境界を下限 0.5 に収めると SnapFrame(0.5) = 偶数丸め(12.5)/25 = 12/25 = 0.48 秒)。'
  rationale: 'TimeMath.MinLen / SnapFrame、DocumentState.MoveBoundary / MoveTrim(Clamp→SnapFrame の順)と SplitAt(SnapFrame の後に判定)。受入は unit で完全一致: 25 fps・区間 [0,10)+[10,20) で境界を 0.3 秒へ動かすと先頭区間 0.48 秒、トリム開始を 9.5 へ動かすと 9.52 秒(237.5 → 238)で先頭区間 0.48 秒。四捨五入で実装すると 0.52 / 9.52 となり 1 点目で不合格になる。'
  rationale_precision: ok
  classification_hint: core
  priority: must
  source_refs:
  - authority/Models/TimeMath.cs#SnapFrame
  - authority/Models/DocumentState.cs#MoveBoundary
  - authority/Models/DocumentState.cs#MoveTrim
