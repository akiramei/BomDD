- id: REQ-083
  statement: '書き出しの結果: 成功したらダイアログを閉じ、未保存の変更をオフにし、状態の文言を消す。「Abort」で中断したら「Export canceled.」、出力の総時間が 0 以下なら「Output duration is zero.」、書き出す区間が無ければ「There are no regions to export.」、ffmpeg が 0 以外で終了したら「ffmpeg exited with an error (code {N}).」の次の行に ffmpeg の標準エラーの最後の 8 行(空行を除く)を、ボタンの上に warn 色で表示する。書き出しの開始時(コピーのとき)のキーフレームの算出で例外が出る(ffprobe の 20 秒の打ち切り・ffprobe の起動の失敗)と、例外は ConfirmExport の try の外の EnsureCopyCutAsync から出る。この例外はコマンドの外へ捕捉されずに出る。CommunityToolkit.Mvvm 8.4.0 の非同期コマンドは既定で例外を UI スレッドへ投げ直し、アプリは未処理の例外の処理を持たないので、アプリは異常終了する(これを再現する結果とする。ドロップの async void も同じ経路)。VM には書き出し中の状態が残る(IsExporting は真のまま・「Abort」の取り消しは算出に渡されない・閉じる操作は書き出し中なので効かない)。再エンコードの書き出しで ffmpeg の起動の例外が出たときも同じく異常終了する。VM には、finally で書き出し中の状態が解け、状態の文言が「Exporting…」のまま残る(異常終了しなければボタンの上に warn 色で見える)。結果の文言はダイアログを閉じて開き直しても、次の書き出しを始めるまで残る。'
