- id: REQ-018
  statement: 動画の解析は ffprobe の JSON 出力から行う。読み込めるのは、ファイルが存在し、ffprobe が正常終了し、映像ストリームがあり、幅と高さが正、長さが正のとき。長さは format の duration、無ければ最初の映像ストリームの duration。fps は avg_frame_rate が正ならその値、無ければ r_frame_rate、どちらも無ければ 30。可変フレームレート(VFR)とみなすのは両方が正で |avg − r| > max(0.1, 0.005·max(avg, r)) のとき。コーデックの表示名は h264→H.264・hevc→H.265・vp9→VP9・av1→AV1・aac→AAC・mp3→MP3・opus→Opus・ac3→AC-3・pcm_s16le→PCM・それ以外は大文字化、音声が無ければ「—」。音声のサンプルレートは最初の音声ストリームの値、無ければ 48000。
  rationale: MediaProbe.ProbeAsync / ParseFrameRate / FriendlyCodec。ffprobe の出力 JSON を与えた unit で完全一致(VFR の閾値の境界を含む)。ffprobe が起動できないときは「失敗」ではなく例外になる(ffmpeg の節)。
  rationale_precision: ok
