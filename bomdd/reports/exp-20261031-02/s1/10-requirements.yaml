  rationale: 状態表示の文言と色は Edited フラグの 2 値で決まる(Edited の意味は履歴節)。文言は両言語で完全一致、色は 16 進値で完全一致。各ボタンにはツールチップ(Language / About MoviePad / Minimize / Maximize / Close)がある。
  rationale_precision: ok
