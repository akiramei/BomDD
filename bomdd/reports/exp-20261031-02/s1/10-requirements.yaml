- id: REQ-087
  statement: '形式ごとの符号化: MP4 は映像 libx264(preset medium・crf 18・yuv420p)と音声 AAC 192 kbps、+faststart、映像トラックのタイムスケールを出力 fps の分子、ムービーのタイムスケールを lcm(分子, サンプルレート)(音声なしは分子)にする。中間ファイルは映像 FFV1(level 3)と音声 PCM 16bit。ProRes は映像 prores_ks(profile 3 = 422 HQ・yuv422p10le)と音声 PCM 16bit。CFR の経路(書き出しの厳密な時間計算ができるとき)では、どの形式も出力フレームレートを -r p/q で明示する(MP4 のタイムスケールの指定もこの経路だけ)。VFR などの従来経路では -r もタイムスケールも付けない。ソースに音声が無ければ音声のストリームを出力しない。保存先に同名のファイルがあれば上書きする。再エンコードの引数の並びは、-y -hide_banner -nostats -progress pipe:1、[シーク位置 S > 0 のとき -ss S]、-i ソース、[S > 0 で音声があるとき、シークしない 2 本目の -i ソース]、-filter_complex グラフ、-map [vout]、[音声があれば -map [aout]]、符号化の引数、出力の時間の引数、出力パス。S は残る範囲の開始(SpanStart)が 1.0 秒以上ならその値、未満なら 0(シークしない)で、CFR の厳密な経路ではS を (n0 − 1/2)/ソース fps(n0 は最初の run の最初のソースフレーム・ExportClock.SeekTarget)に置き換える(その値が 0 以下なら置き換えない)。S > 0 のとき、グラフの映像の時刻は S を引いた値で書き、音声は 2 本目の入力 [1:a] から絶対時刻で切り出す(S = 0 なら [0:a])。秒の値は小数 6 桁まで(末尾の 0 は付けない)。'
  rationale: FfmpegExporter.EncoderArgs / OutputClockArgs / BuildFilterArgs・ExportAsync の seekBase(SeekFromSeconds = 1.0)・ExportClock.SeekTarget。ffmpeg の引数の文字列を unit で完全一致、出力のストリーム構成を L3 で確認。
  rationale_precision: ok
