- id: REQ-086
  statement: ソースが VFR のとき(または fps・速度が正の有限値でないとき)は、区間ごとに映像を trim+setpts、音声を atrim+テンポで処理して concat でつなぎ、速度の変更・fps の変更・VFR のいずれかがあれば最後に fps フィルタで出力 fps の CFR にする。音声は区間ごとに atrim(絶対時刻)→ asetpts → 速度の変換 → 音量(100% でないとき)の順で、速度の変換は速度 1 でも必ず入れる(ピッチ維持オンなら atempo=1、オフなら asetrate=サンプルレート,aresample=サンプルレート)。映像の trim の時刻は入力シークの位置を引いた値。この経路は厳密な時間の保証の対象外。
