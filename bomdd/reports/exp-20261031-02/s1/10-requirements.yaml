- id: REQ-050
  statement: 'トラックにはサムネイルと音声波形を表示する(どちらも常に表示・切り替える UI は無い)。実データが届くまではサムネイルの代わりに色のグラデーションのブロックを、波形の代わりに擬似の波形を描く。実サムネイルは縦横比を保ったまま幅 = トラック高 92 px × 縦横比 のコマとして並べ、コマの間に目地を描く。描き方は 2 通り: キャッシュにあった全体のフィルムストリップは、コマ幅の格子(描画範囲の左端を格子に切り下げた位置から)にコマを並べ、各コマにはコマの中心の時刻に最も近いサムネイルを使い、不透明度 0.5(近似版の間は 0.4)で描き、目地は幅 3 px の #0A0B0D を不透明でコマ幅ごとに引く。可視範囲のサムネイルは、各サムネイルの時刻を中心にコマを置いて不透明で描き、目地は幅 2 px の #0A0B0D を各コマの右端に引く。代わりのブロックは max(6, round(全幅/120)) 個の等幅で、i 番目(p = i/個数)を上 OKLCH(0.45, 0.10, 250 + 90p)・下 OKLCH(0.26, 0.07, 210 + 110p)(どちらも不透明度 0.42)の、(0, 0) から (0.3, 1) への線形グラデーションで塗る。全体のフィルムストリップが無いときは、代わりのブロックの上に可視範囲のサムネイルを重ねる。波形はクリップ全長を等分したバケットごとの最小/最大の包絡で、トラック下部の高さ 38 px の帯に描く。'
  rationale: 'TimelineControl.DrawThumbs / DrawPlaceholderThumbs / DrawVisibleThumbs / GetWaveGeometry(ThumbGapBrush #0A0B0D)、ShowThumbs/ShowWaveform は既定 true で切替 UI なし。L2。'
