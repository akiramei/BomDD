- id: REQ-094
  statement: '環境変数によるデバッグ・ドキュメント撮影用の動作(未設定なら何もしない): MOVIEPAD_OPEN=パス で起動時にそのファイルを開く。MOVIEPAD_SCENARIO=名前 で編集状態を直接作る(履歴に積まない): ffmpeg= 初回セットアップを表示、trim= トリム 2〜17 秒・1 区間・再生ヘッド 9、split= 90 秒を 30 秒ずつ 3 区間・再生ヘッド 15、speed= 中央区間 2x・再生ヘッド 45、exclude= 中央区間を除外・再生ヘッド 15、volume= 中央区間の音量 0.5・再生ヘッド 45、mute= 中央区間の音量 0・再生ヘッド 45(3 区間の形はトリム 0〜90)。MOVIEPAD_SHOWEXPORT / MOVIEPAD_SHOWABOUT が空でなければ書き出しのダイアログ / About を開く。MOVIEPAD_SHOT=パス なら、ウィンドウを開いた後の処理(MOVIEPAD_OPEN の読み込みの完了を待ち、シナリオとダイアログを適用した後)から 1800 ms 後にウィンドウを PNG(96 dpi・クライアント領域の大きさ)に保存して閉じる(保存の失敗は無視して閉じる)。MOVIEPAD_SHOT があり MOVIEPAD_INSPECTOR_SCROLL が現在のカルチャーの数値の書式で読める(double.TryParse・カルチャー依存)なら、同じ起点から 1200 ms 後にインスペクターの縦スクロールをその位置にする。MOVIEPAD_TTI=パス なら読み込みの各段の経過時間の行をそのファイルに追記する。MOVIEPAD_CACHE_DIR があればサムネイル・波形のキャッシュの置き場をそこにする。処理の順は 開く → シナリオ → 書き出し → About。'
  rationale: MainWindow.OnOpened / ApplyScreenshotScenario、LoadProfiler、MediaPreviewService.CacheRoot。環境変数を与えた起動で L2 観測。
