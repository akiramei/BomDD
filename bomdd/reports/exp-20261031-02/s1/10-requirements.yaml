- id: REQ-014
  statement: '起動時に ffmpeg が使えないときは、画面中央に ffmpeg セットアップのオーバーレイ(幅 470 px・背景を暗くする)を出す。タイトル「ffmpeg setup」・説明文・「Later」「Download」ボタンを持つ。「Later」はオーバーレイを閉じるだけで、次回の起動時には再び出る。オーバーレイを閉じた後も UI と(サンプルの)編集操作は使える。ffprobe/ffmpeg がどこにも無い状態でファイルを開く・書き出すと、プロセスの起動の例外が捕捉されずに UI へ伝わる: 読み込みエラーのバナーも書き出しの失敗文言も出ず、クリップは変わらない。この例外はコマンドの外へ捕捉されずに出る。CommunityToolkit.Mvvm 8.4.0 の非同期コマンドは既定で例外を UI スレッドへ投げ直し、アプリは未処理の例外の処理を持たないので、アプリは異常終了する(これを再現する結果とする。ドロップの async void も同じ経路)。書き出しのときに VM に残る状態(再エンコードは「Exporting…」の文言、コピーは書き出し中のまま)は書き出しの状態の節と同じ。サムネイル・波形は失敗を握りつぶして擬似表示のまま。'
  rationale: ShowFfmpegSetup の初期値は !FfmpegLocator.Available。DismissFfmpegSetup は保存しない。MediaProbe.ProbeAsync は RunAsync を try の外で呼び、ConfirmExport は OperationCanceledException だけを捕捉する(OnDrop は async void)。App / Program に未処理の例外の処理は無い。表示条件は unit、文言は L1 で完全一致、ffmpeg 無しの開く/書き出しは L2 で観測。
  rationale_precision: ok
  classification_hint: core
  priority: must
  source_refs:
  - authority/ViewModels/MainWindowViewModel.cs#MainWindowViewModel()
  - authority/Views/MainWindow.axaml:75-106(ffmpeg 初回セットアップの Panel)
