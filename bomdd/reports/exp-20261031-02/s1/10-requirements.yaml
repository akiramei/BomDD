  statement: 再エンコードの書き出しは、除外していない区間とトリム範囲が重なる部分を、タイムラインの順に、各区間の速度で再生した映像と音声をつないだものになる(重なりが 0.0001 秒以下の区間は除く)。出力解像度がソースと違うときだけ lanczos で W×H に拡大縮小する。音声は区間ごとに、速度の変換をしてから一定の倍率で音量を掛ける(100% なら掛けない)。速度の変換は、CFR の厳密な経路では速度が 1 でないときだけ入れ(VFR などの従来経路は速度 1 でも入れる・従来経路の要求)、ピッチ維持オンなら atempo(1 段あたり [0.5, 2.0] に収まるよう複数段に分ける)、オフならasetrate(サンプルレート·速度)の後に元のサンプルレートへ aresample(音の高さが速度に比例して変わる)。ソースの映像・音声ファイルは変更しない。
