  external_source: ffmpeg のフィルタ仕様(trim の start/end・end_frame・start_pts、settb・setpts、fps の round=up、tpad の stop_mode=clone、atrim の start/end・start_sample/end_sample、apad whole_len、atempo・asetrate・aresample、concat)
  acceptance_intent:
    depth_hint: L3
    tolerance_hint: フレーム数・サンプル数・PTS は完全一致(ZERO)
    approver_hint: automated
