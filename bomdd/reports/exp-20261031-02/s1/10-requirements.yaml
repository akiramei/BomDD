  - サンプルの区間が 1 区間・全長で表示される
- id: REQ-002
  statement: 'サンプルを含め、クリップが一度設定されると「クリップなし」の状態には戻らない。したがってタイトルバーの「No project loaded」(ja: プロジェクト未読み込み)表示・ツールバーの開く以外の非表示・タイムライン/インスペクター/プレビュー/トランスポートの非表示は、実際の動作では到達しない。'
  rationale: Clip を null にするコードが無い(読み込み失敗時も既存のクリップを保持する)。表示条件(HasClip/NoClip)の作り込みはあるが到達不能。再製造で空状態を作り込んでも、到達経路が無いことを検査で確かめる(読み込み失敗後も前のクリップが残る、を L1 で)。
  rationale_precision: ok
  classification_hint: core
  priority: must
