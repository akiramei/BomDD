- id: REQ-058
  statement: 再生速度の欄は、速度の数値(大きな文字・速度 ≠ 1 なら accent-text 色)と「x」、スライダー、プリセット 0.25x・0.5x・1x・1.5x・2x・3x・4x、要約「This region exports as {出力の長さ} (originally {元の長さ}).」を持つ。スライダーの値は log2(速度) で範囲 [−2, 2]、動かすと速度 = 2^値 を連続して反映する(値の変更そのものは履歴を記録しない)。履歴の記録(BeginInteractiveEdit)は、スライダー自身の PointerPressed の通常のハンドラ(処理済みのイベントは受けない)だけに結線されている。スライダーのテンプレート(Styles/Controls.axaml の Slider.rng)は、高さ 28 px の透明な枠の中央に Track を置き、Track の横幅全体をつまみ(Thumb 18×18)と左右の透明な RepeatButton(PART_DecreaseButton / PART_IncreaseButton)が埋める。Avalonia の Thumb と RepeatButton は押下を処理済みにするので、つまみやトラックを押してドラッグしても履歴は記録されず、値の変更だけが反映される。このとき元に戻すは、スライダーの変更と、その前に記録した最後の操作をまとめて戻す(1 回で、その操作の前の状態になる)。記録されるのは、押下が子に処理されずにスライダーまで届いたとき(Track の上下の透明な余白を押したとき)だけで、そのときは押した時点の 1 件。再製造は同じテンプレート構成と同じ結線にし、操作ごとの記録件数が元のアプリと一致すること。プリセットは押すたびに履歴に記録する。表示中の速度の表記とプリセットの値が一致するプリセットを選択状態で表示する。
  rationale: InspectorView の SpeedSlider と ApplySpeedPreset、SpeedLog2。表示と値の変換は unit で完全一致(スライダー 0.3 → 2^0.3 = 1.231 → 1.23)、スライダーの履歴の記録は L2 で観測。
  rationale_precision: ok
  classification_hint: surface
  priority: must
  source_refs:
  - authority/Views/InspectorView.axaml#Inspector_PlaybackSpeed
  - authority/ViewModels/MainWindowViewModel.cs#SpeedLog2
  - authority/ViewModels/MainWindowViewModel.cs#ApplySpeedPreset
  - authority/docs/QUICKSTART.md#4.3 Change speed per region (with pitch preservation)
  external_source: Avalonia 12.0.0 の Slider / Track / Thumb / RepeatButton のポインタの処理(押下を処理済みにする)
  acceptance_intent:
    depth_hint: L2
    tolerance_hint: exact
    approver_hint: automated
