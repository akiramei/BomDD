- id: REQ-088
  statement: コピーの書き出しは、開始をトリム開始以下で最大のキーフレーム(求められないか範囲外なら残る範囲の開始)とし、長さを 残る範囲の終わり − 開始 として、最初の映像と最初の音声のストリームを再エンコードせずにコピーする(負のタイムスタンプは 0 起点に・+faststart)。欲しい範囲は欠けず、先頭にキーフレームからトリム開始までのリードが付く。VFR はそのまま VFR で出る。キーフレームはトリム開始を基準に求め、残る範囲の開始以下なら採用するので、先頭側の区間を除外して残る範囲がその後ろから始まるときは、除外した区間がまるごと(さらにその前のリードも)出力に入る(元のアプリの不具合として再現する)。このときもリードの表示はトリム開始との差だけを示し、ダイアログの帯もトリム開始・終了を基準に描く。
  rationale: FfmpegExporter.BuildCopyArgs / CopyStart。先頭側の除外区間が入るのは不具合だが、正の規則(不具合も再現)により実際の動作で書いた。引数の文字列を unit で完全一致、出力の長さを L3 で確認。
