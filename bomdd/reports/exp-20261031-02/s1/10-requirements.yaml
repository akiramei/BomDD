- id: REQ-085
  statement: 'ソースが CFR のとき、再エンコードの出力は出力 fps の CFR で、出力の総時間 T = Σ(重なりの長さ / 速度)を有理数で厳密に計算し(速度は 0.01 刻みの値を c/100、時刻はソース fps の格子上の値として扱う)、出力フレーム数は RoundHalfUp(T·出力 fps)(中点は切り上げ・偶数丸めではない)、音声の総サンプル数は RoundHalfUp(T·サンプルレート)。出力の各フレームは、その時刻以前で最も新しいソースのフレームを使う(sample-and-hold)。境界の決め方(すべて有理数で厳密): 統合後の各 run k の出力上の開始 T_k(T_0 = 0、T_{k+1} = T_k + (終了 − 開始)/速度)について、run が持つ出力フレームは [min(ceil(T_k·出力 fps), N), min(ceil(T_{k+1}·出力 fps), N))(N は総フレーム数)、出力フレーム i が使うソースフレームは floor((開始 + (i/出力 fps − T_k)·速度)·ソース fps)、run が読むソースフレームは floor(開始·ソース fps) から ceil(終了·ソース fps) まで(最低 1 枚)。音声は run ごとにソースのサンプル [RoundHalfUp(開始·サンプルレート), RoundHalfUp(終了·サンプルレート)) を切り出し、速度変換(速度 1 は変換なし)と音量の後、出力上の長さ RoundHalfUp(T_{k+1}·サンプルレート) − RoundHalfUp(T_k·サンプルレート) サンプルへ無音の付け足しか切り詰めで揃える。映像と音声は別々につなぐ。入力シークの位置と、映像の時刻のずらし方・音声の 2 本目の入力は、形式ごとの符号化の要求の引数の並びを参照。ソース上で連続し、速度・音量・ピッチ維持が同じ隣り合う区間は1 つとして扱い、区間を分割/結合しただけでは出力のフレーム列・枚数・タイムスタンプ・音声の内容を変えない(ゼロの挿入もない)。'
  rationale: 'ExportClock.Build(層 N の統合・層 C の累積クロック)と ECO-002 の不変条件(分割/統合不変性)。ECO-002 の観測: 30000/1001 fps・2x で分割すると120→122 フレームになった欠陥の是正。ECO-002 は変更台帳で staged(golden 未承認)のままだが、ソースには是正後のコードが入っているので、正の規則(実際の動作が正)により是正後で書いた。受入は L3: PCM はビット一致、MP4 はフレーム ID・PTS・音声タイムラインの一致(許容差ゼロ)。'
  rationale_precision: ok
  classification_hint: surface
  priority: must
  source_refs:
  - authority/Services/ExportClock.cs#Build
  - authority/Services/ExportClock.cs#SourceFrameOf
  - authority/Services/FfmpegExporter.cs#BuildExactGraph
