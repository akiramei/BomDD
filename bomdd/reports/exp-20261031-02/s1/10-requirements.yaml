- id: REQ-055
  statement: サムネイルと波形の生成は単一の作業者のキューで、待っている要求の中から優先度の高いもの(シーク用のサムネイル → 可視範囲のサムネイル → 波形 → アイドルのキャッシュ、同じ優先度は先着順)を次に実行する。実行中の要求は横取りしないので、波形の要求が実行中(読み込み後の 1200 ms の待ちも作業者の中で行う)のあいだは、後から来た可視範囲のサムネイルはその完了を待つ。失敗した要求は無視して次へ進む。ffmpeg は通常より低い優先度(BelowNormal)で動かす。同じ種類の要求は最新の 1 件だけを残す。新しいクリップを読み込むとキューの要求をすべて取り消す。
  rationale: MediaJobQueue(Priority・coalesce key・DrainAsync・SelectNextIndex)と VM.GenerateWaveformAsync(Task.Delay をジョブの中で待つ)。応答性のための設計。unit で順序・横取りしないこと・取り消しを確認。
  rationale_precision: ok
  classification_hint: core
  priority: could
