- id: REQ-080
  statement: 'コピーの開始に使うキーフレームは、トリム開始以下で最大のキーフレームの時刻。ffprobe で対象時刻の手前 12 秒だけを読み、見つからなければ読む幅を4 倍に広げて最大 4 回まで試す。読む窓は [max(0, 対象 − 幅), 対象] で、幅は 12・48・192・768 秒の順。窓の開始が 0 に達しても見つからないとき、また 4 回試して見つからないとき(トリム開始が 768 秒を超えるとき)は 0 とする(先頭はキーフレームとみなす)。ffprobe が 0 以外で終了したときは「その窓にキーフレームが無い」と同じに扱うので、ffprobe の失敗でも答えは 0 秒になる: コピーはファイルの先頭から始まり、0 秒からトリム開始までがすべてリードとして出力に入り、リードの文言とタイムラインの帯もこの値を使う。トリム開始が 0 以下なら 0。結果(失敗による 0 も)はパスと時刻(ms・偶数丸め)で覚えて再利用する。答えを求めない(null)のはオンラインのみのファイルのときだけで、このときコピーは残る範囲の開始から始める。1 回の ffprobe は 20 秒で打ち切り、打ち切りは例外として呼び出し側へそのまま出る(結果は覚えない・書き出しの状態の節を参照)。'
  rationale: KeyframeIndex.GetKeyframeAtOrBeforeAsync。unit(ffprobe の出力・終了コード ≠ 0・打ち切りを与える)で完全一致。
  rationale_precision: ok
  classification_hint: core
  priority: must
