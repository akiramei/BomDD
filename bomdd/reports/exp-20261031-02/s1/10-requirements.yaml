- id: REQ-071
  statement: 元に戻す/やり直すの対象は編集ドキュメント(トリムと区間列)だけで、最大 50 件まで保持し、超えたら古いものから捨てる。分割・結合・In/Out・プリセット・トグル・ミュート・除外は 1 操作につき 1 件、タイムラインのドラッグは押した時点の 1 件だけを記録する。スライダーは、押下がスライダー自身まで届いたとき(Track の上下の余白)だけ押した時点の 1 件を記録し、値の変更そのものは記録しない。つまみ・トラックを押したドラッグでは記録されない(インスペクターの節)。新しく記録するとやり直しの履歴は消える。出力解像度・縦横比の維持・出力 fps・書き出し形式は履歴の対象外(元に戻しても変わらない)。元に戻す/やり直しの後は編集対象を再解決する。読み込みで履歴は空になる。
