- id: REQ-091
  statement: '画面の外観(暗い配色・フォント Manrope と JetBrains Mono(等幅の数値表示)・角丸・影・各ボタンの見た目)はデザイントークンと UI の契約に従う。配色は styles.css の oklch の定義を sRGB に厳密に変換した値(Tokens.axaml の計算値)を使う。完全一致で合わせる範囲: (1) Styles/Tokens.axaml の値を持つ全キー(色は名前+Color、Brush は名前+Brush: BgWindow・BgApp・Surface・Surface2・Surface3・Line・LineSoft・Text・Text2・Text3・Text4・Accent・AccentSoft・AccentLine・AccentText・OnAccent・PrimaryHover・Warn・Ok・CloseHover・OverlayBlack50・OverlayBlack42・OverlayBlack18・Scrim・White12・White18・White10・White08・White06・TrimMask・Wave・EmptyCard(この 32 色は Color と Brush の両方)、BrandGrad2Color・StageRadialColor(Color のみ)、BrandGradientBrush・StageBackgroundBrush(Brush のみ)、RadiusSm/Md/Lg/Xl/Pill、FontUi・FontMono。色でない EqualsConverter は値の照合の対象外で、同じ働き(値の等しさを返す変換)を持つこと)。(2) Styles/Controls.axaml の各セレクターが設定するプロパティの値(Button.btn とその primary・ghost-line・icon・sm・disabled・pointerover、Button.preset と active、Button.tp と play、Button.win と close、Border.pill・Border.section、Border.fmt と sel・radio・tag・dot、ToggleButton.toggle と checked、Slider.rng、TextBox.num-input
    と focus・pointerover、TextBlock.eyebrow・h4・k・v・mono・muted)。配置(並び・入れ子・どの要素にどのクラスが付くか)は各 View の構造どおりにし、ピクセル単位の位置は合わせない。'
  rationale: README の設計メモ(デザイントークン・OklchColor)と bomdd/ui の UI 契約(ui-bom・裁定 37)。許容差は pixel-exact を既定にしない(裁定)。トークンとスタイルの値は .axaml の値を読む L2 で完全一致、配置は View の論理ツリーの構造で照合する。
