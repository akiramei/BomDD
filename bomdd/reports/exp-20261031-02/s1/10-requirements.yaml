- id: REQ-048
  statement: 'タイムラインのトラックには、各区間について次を描く: 速度が 1 でなく除外していない区間に速度の色(不透明度 0.34)の塗り(速度の色は d = log2(速度)(速度 ≤ 0 なら 1 とみなす)として、L = clamp(0.42 + 0.07d, 0.30, 0.62)、C = clamp(0.05 + 0.07|d|, 0.04, 0.16)、H = d ≥ 0 なら 256 − 14d、それ以外は 256 + 6|d| の OKLCH を、トークンと同じ変換(OklchColor)で sRGB にしたもの)、除外していない区間で、幅 rw が 44 px を超え、かつラベルの位置 labelX = max(区間の左端 + 8, 描画範囲の左端 + 8)(描画範囲の左端 = max(0, 横スクロール位置 − 400 px)。端の欠けを防ぐ 400 px の余白込み) が 区間の右端 − 44 より左(区間の左端が描画範囲の中にあれば幅が 52 px を超えるとき)にラベル(速度アイコン+「{速度}x」、ピッチ維持オフかつ速度 ≠ 1 なら「♪off」(warn 色)、ミュートならスピーカー×アイコン(warn 色))、内部の境界ごとに区切り線と上端の小さな刻み、トリム範囲の外に暗いマスク、編集対象の区間にaccent 色(#579BF4)2 px の枠、トリム開始・終了の位置にトリムハンドル(幅 7 px・トラック高の 66%・縦中央・accent 色の角丸の棒に白の縁取りと中央の短い横線 2 本)、再生ヘッドに白い線と上端のマーカー。描く順(後ろほど上): ルーラー → トラックの背景 → サムネイル → 波形 →ミュート表示 → 速度の塗りとラベル → 除外のマスク → トリム外のマスク → 編集対象の枠 → 境界 → トリムハンドル → コピーのリード → 再生ヘッド。'
  rationale: TimelineControl.Render / DrawTrack / DrawTrackContents(順序)・SpeedColor.Color・DrawRegions / DrawRegionLabel / DrawBoundaries / DrawTrimMask / DrawSelectedOutline / DrawTrimHandles / DrawPlayhead。描画要素の有無を L2 で、固定の色(accent・白・マスク等)は 16 進値で完全一致、速度の色は SpeedColor の式と OklchColor の変換で計算した 8 bit 値に完全一致(unit)。ラベルの有無は幅 52 px・53 px の区間と、左端が画面外の区間で確かめる。px 単位の位置は pixel-exact を既定にしない(bomdd/ui の方針)。
  rationale_precision: ok
  classification_hint: core
  priority: must
