- id: REQ-095
  statement: 書き出しダイアログ・About・ffmpeg セットアップのオーバーレイは、タイトルバーとリサイズ用の縁を含むウィンドウ全体を覆う(背景は Scrim の色で暗くする)。表示中は、タイトルバーのドラッグでの移動・ダブルクリックでの最大化・縁のリサイズ・最小化/最大化/閉じる/言語/About のボタン、ツールバー・プレビュー・タイムライン・インスペクターのマウス操作は使えない(キーボードの操作は働く・キーボードの節)。書き出しと About は、タイトルバーの上を含むモーダルの外を押すと閉じる(書き出し中の書き出しダイアログは閉じない)。ffmpeg セットアップは外を押しても閉じない。読み込みエラーのバナーはオーバーレイの下になる。ファイルのドロップはオーバーレイの表示中も受け付ける。
