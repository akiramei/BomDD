# bomdd/process-profile.yaml — process-core 運用プロファイル(harness ECO-015・ECO-016)
#
# 本ファイルの存在が「このリポは process-core(hooks+lifecycle validator)の管理下」の宣言。
# 撤去(無効化)も **ECO 経由**で行う(ECO-016 案a — HEAD に本ファイルが実在する限り、
# 削除・改変は open ECO を要求する E08 自己保護の対象。武装解除も変更管理の対象)。
# 本ファイル・bomdd/hooks/・bomdd/tools/process-validator.py 等は profile の設定に依存しない
# **コード固定の自己保護パス**(部分変異による無音無効化は validator が exit 2 で遮断)。
# 差分(パス・語彙・trailer 名)はここで注入し、不変条件は validator のコードに固定する
# (adapt を自由な再設計にしない — process reuse map の規律。出典= ViewPrism2 E14〜E19 /
#  ViewTube PR-LIFECYCLE-VALIDATOR・FINDINGS §11.5・独立検査 REV-01〜13)。
# 台帳の placeholder は title「<一行要約>」完全一致のみ検査対象外(sentinel)。
bomdd:
  layer: ProcessProfile
  product: "{{PRODUCT}}"
  installed: "{{DATE}}"
  source: "BomDD harness ECO-015(process-core 汎用核)"

# 保護パス: この配下の変更は open 状態の ECO を要求(E01)
protected_paths: [src/, test/, tests/]

# 変更台帳(60-change-register テンプレの実体)
register: bomdd/60-change-register.yaml

# 状態語彙(states の順序どおりの前進のみ許可 — 飛び越し/後退/削除は E03)
# 既定は kit 同梱スキルの実挙動に合わせた 2 状態(eco-file= staged / eco-accept= applied)。
# ViewTube 型 3 状態にするには states を [staged, implemented, applied] とする —
# implemented 遷移で trailers.fix が強制される(E04)。
states: [staged, applied]
initial: staged
open_states: [staged]                    # 保護パス変更を許可する状態(E01 の判定)
terminal_extra: [rejected, superseded]   # どの状態からも遷移可・以後の遷移は E03

# commit trailer(状態遷移コミットの本文末尾に要求)
#   implemented 遷移 → 「BomDD-ECO-Fix: <id>」(E04・3 状態語彙のときのみ)
#   applied 遷移     → 「BomDD-ECO-Accept: <id>」(E05)
# applied エントリは履歴に accept trailer commit が実在しなければならない(E06)—
# 自然文の了承・会話記録は承認証拠にならない。
trailers:
  fix: BomDD-ECO-Fix
  accept: BomDD-ECO-Accept

# 履歴合法性の再演(第 2 層・ECO-018)の起点。既定は「本ファイルを最初に追加した commit」の
# 自動検出 — process-core を後から導入したリポの導入前履歴を違法として止めないための境界。
# 導入点を明示したい場合のみ commit-ish を宣言する(証拠要求 E06/E09 の対象範囲も同じ境界で
# 決まる: 導入点より前から台帳にあった ECO は trailer 証拠を要求されない)。
# history_replay_since: <commit-ish>
