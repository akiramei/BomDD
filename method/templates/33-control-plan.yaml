bomdd:
  product: <プロジェクト名>
  experiment: <ループID>
  layer: Control Plan

# 深さの梯子(method-v1 §5): unit < L1 存在 < L2 メタデータ < L3 content/signal < G golden+承認者
#   核 = unit(exact, 丸め規定込み)
#   表面 = 外部ツール≥L2 / 同期・座標系=L3 / 知覚=G(golden+許容差+承認者)
#   L0 文字列照合・pixel-exact は既定不採用(例外: 仕様化された正規形のみ)
#   原典ありの UI/帳票 surface = pixel-exact ではなく、表示要素集合の全数存在+意味一致を必ず検査
# 深い段は FMEA で要注意と判定した特性にのみ割当(コスト)

control_plan:
  depth_ladder:
    unit: <この題材での unit 検査の定義>
    L1: <プロセス起動・成果物存在>
    L2: <メタデータ検査(例 OpenAPI JSON / ffprobe)>
    L3: <内容・信号・相互作用(例 HTTP 実打 / 音声相関)>
    G: <人間承認(知覚・ユーザビリティ)>

  check_mapping:                        # candidate(ECO-115・playbook §4.4「前進の判定」I2): 証拠の形式名 → {row_key, outcomes, identity}。判定は証拠をこれだけで読む。
    line:                               #   形式名の例: line(1 行 1 検査)/ xunit-v3(row_key= 値が行 ID になる trait 名。例 cp)
      row_key: '(?P<outcome>[A-Z]+) (?P<row>\S+)(?: .*)?'   # line 形式: 名前付きグループ outcome と row を持つ正規表現。行全体が一致した行が 1 つの検査。行を名指さない検査は持ち主のない検査
      outcomes: {PASS: passed, FAIL: failed}                # 形式の結果語をそれぞれ passed | failed | skipped | not-run のどれかへ(無い語の検査はその証拠の行を unmeasurable にする)
      identity: '(?m)^MEASURED_ON (?P<commit>[0-9a-f]{40}) (?P<tree>[0-9a-f]{40})$'   # 名前付きグループ commit と tree を持つ正規表現。証拠が名指す測った個体(計器が走るときに書く)

  characteristics:
    - id: CP-<NAME>-001
      characteristic: <保証する特性(1文)>
      classification: core              # core | surface
      verifies:
        - E-<NAME>-001
        - M-<NAME>-001
      requirement_refs:
        - REQ-001
      when: acceptance                  # candidate(ECO-098): ほかに測る機会(例 acceptance= 機械受入のたび / dependency-update= 依存の更新時)。
                                        # 前進の判定(ECO-115・playbook §4.4「前進の判定」I1)は when を読まない — M-BOM が挙げる行は when にかかわらず納品のたびに数える
      on_fail:                          # candidate(ECO-098・ECO-115 playbook §4.4「前進の判定」I2・D2): 落ちたときの振り分け。違反(red)と測定不能(unmeasurable)を分ける。
        red: product-fix                #   値は product-fix(製品修正)| instrument-recovery(測定系復旧)| control-plan-fix(Control Plan の修正)。
        unmeasurable: instrument-recovery  # 無ければ既定: violation → product-fix・unmeasurable → instrument-recovery・no-check → control-plan-fix
      status: ~                         # candidate(ECO-115・playbook §4.4「前進の判定」I2): 無い(~)か retired。retired の行を M-BOM が挙げると入力の欠陥
      part_standard_refs: []            # candidate(ECO-114・playbook §4.5「部品規格」C1): この行が一部でも測る M-BOM の provides 項目の ID(例 [PS-M-<NAME>-001-P01])。
                                        # 測らない項目は挙げない。挙げた項目のうち測らない部分は known_limits に項目の ID を付けて書く
      invariant_refs: []                # candidate(ECO-086): この行が検査する仕様 §3 の不変条件 ID(例 [INV-003])。
                                        # 部品に不変条件があるのに空= その不変条件は検査行に届いていない。検査しない不変条件は
                                        # 20-spec §3 の「検査する CP」列に理由を書く(部品に検査行が 1 本あることは不変条件ごとの検査を意味しない)
      depth: unit                       # unit | L1 | L2 | L3 | G
      tolerance: exact                  # exact | ±N ms | ΔE<N | required nodes present ...
      fixture: <治具(受入ハーネスのパス)>
      oracle: <合否の判定方法(1文)>
      approver: automated               # candidate(ECO-115・playbook §4.4「前進の判定」I2): automated | human:<role> | automated+human:<role>(G は人間必須)。
                                        # 前進の判定が決めるのは automated を含む行の自動の部分だけ。人の部分は Phase 5
      evidence_output_ref: bomdd/plm-intake/sync-results/<evidence>.json
      test_vectors:                     # 完全性が要る特性は必須(CHEAT-005: 中間値ベクタ未整備が
        - <境界値>                      #   サイレント乖離を通した。「受入の被覆が捕捉を決める」)
        - <中間値(丸めの分岐点)>
        - <反例(FMEA の故障モード由来)>
      known_limits: []                  # candidate(ECO-102・playbook §4.5 ④): この行が測っていないこと(検査していない経路・測っていない条件・読みだけで
                                        # 確かめた事項)。検査の層が自分で言う— M-BOM の行に「NOT exercised by any case」のような注記を書かない。
                                        # 実測値とレビューの所見は変更記録(ECO 本文・台帳)が正本で、ここには書かない
      trace_links:
        - trace_id: TL-CP-M-001
          from: CP-<NAME>-001
          to: M-<NAME>-001
          relation: verifies
          evidence: bomdd/33-control-plan.yaml
          status: active
      unresolved_questions: []

    # 原典あり/UI surface の表示パリティ行の例。
    - id: CP-<NAME>-DISPLAY-001
      characteristic: <原典表示要素 DC-<SCREEN>-001 の全 required_elements が成果物に存在し、意味が一致する>
      classification: surface
      verifies:
        - E-CHECKOUT-SUMMARY-001
      requirement_refs:
        - REQ-UI-001
      depth: G                          # 自動検出できるなら L1/L2。知覚判断を含むなら G
      tolerance: required-elements-present
      fixture: <スクリーンショット/DOM/アクセシビリティツリー/手動確認手順>
      oracle: <DE 行ごとに存在・表示テキスト/画像・状態を確認。pixel-exact ではなく表示契約に照合>
      approver: human:<役割>
      evidence_output_ref: bomdd/plm-intake/sync-results/<display-evidence>.md
      test_vectors:
        - <通常表示>
        - <空状態>
        - <エラー状態>

    # UI-CAD / Design System BOM の coverage 行の例。
    - id: CP-DESIGN-SYSTEM-COVERAGE-001
      characteristic: <UI-BOM surface item が 35-design-system-bom.yaml の required design parts(Card/CTA/Chip/Badge/IconButton 等)を実機で持つ>
      classification: surface
      verifies:
        - E-CHECKOUT-SUMMARY-001
      depth: G                          # 自動検出できるなら L2。設計言語判断を含むなら G
      tolerance: required-design-parts-covered
      fixture: 43-visual-gap-analysis.md
      oracle: <CAD と実機を比較し、design parts の presence / variant / state / application を確認。素の Border/Text/Button への退化は S2 以上>
      approver: human:<役割>
      test_vectors:
        - <通常表示>
        - <hover/selected/dragging 等の状態>
        - <空/エラー/候補値欠落時>

    # NFR 特性行の例(candidate — 目標値は E-BOM nfr_targets、実現は M-BOM)
    - id: CP-NFR-001
      characteristic: <例 予約作成 p95 < 200ms @ 100 req/s>
      classification: surface
      verifies:
        - E-<NAME>-001
        - M-<NAME>-001
      depth: L3                         # NFR は原則 execution measurement
      tolerance: <例 p95 ≤ 200ms(計測 3 回の中央値)>
      fixture: <負荷計測スクリプト(治具として repo 管理)>
      oracle: <計測手順と判定(環境条件込みで再現可能に)>
      approver: automated

# PLM-ready checklist:
#   - 各 characteristic は verifies / depth / tolerance / fixture / oracle / approver を持つ
#   - G depth は人間承認者が必須
#   - evidence_output_ref は As-Built の test_evidence_refs から参照する
#   - L0/pixel-exact は仕様化された正規形以外では使わない
#   - (candidate・ECO-086)仕様 §3 の各 INV は、いずれかの行の invariant_refs から届くか、20-spec §3 の「検査する CP」列に未検査の理由がある
#   - (candidate・ECO-098)requirement_refs / invariant_refs は「この行のテストが実際に検査する ID」を書く(E 品目の requirement_refs の写しではない)。
#     人が受入で読む表は ID ごとに出し、ID の集合は行の refs と、行を受入に持つ E 品目が負う ID の両方から取る(playbook §4.4)
