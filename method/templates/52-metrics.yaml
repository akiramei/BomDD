bomdd:
  product: <プロジェクト名>
  experiment: <ループID>
  layer: Metrics

# 規律(observation-schema-candidates §4.6, §6):
#   raw 一致率を単独で報告しない。分解して残す。
#   全通過は「完全鋳造」と呼ばず「現固定オラクル被覆で未観測差分ゼロ」と表現する。
# 範囲(ECO-055・2026-09-03): 本テンプレは Phase 5(受入・収束)の計器。ECO レジームの指標
#   (影響なし予測の under-inclusion= 61 / 不要改変= 63 / 回帰・no_impact_prediction= register)は
#   それぞれの成果物が正本であり、本ファイルへ転写・集約しない(§13 記録規約・二重正本の禁止)。
#   各列は「この値が変わったら何の判断が変わるか」(consumer → decision)を持つ列だけを置く
#   (棚卸し= bomdd/reports/52-metrics-inventory-2026-09-02.md)。製品固有の追加列は製品リポの裁量。

metric_runs:
  - loop: <例 forward-01>
    factory: <例 factory-01(opus)>
    bom_rev: <seed | rev1 | ...>
    oracle_ref: bomdd/41-fixed-oracle.yaml@<frozen tag>
    raw_match: <例 14/16>          # 分解 3 列(targeted_fix_success / blocker_diffs / new_unspecified_diffs)の
                                   #   検算用のみ。単独報告禁止(§6.1)。和が合わなければ分解漏れ
    targeted_fix_success: ~        # 前ループで狙った補正が消えたか → 再製造の要否(§6.3)
    blocker_diffs: ~               # blocker 件数(例 1→0)→ 収束ループ終了/継続(§6.3)
    new_unspecified_diffs: ~       # 補正で新たに露出した未規定次元 → 質問リスト・裁定 3 択(§6.2)
    specified_contract_miss: ~     # 明記済み契約の取りこぼし(=工場能力)。消費先= §6.4 帰属の計器:
                                   #   判断は「BOM を改訂しない(過剰仕様化の防止)・manufacturing_miss として
                                   #   fresh 再製造」。工場選定の単軸根拠にはしない(能力は領域・ドメインで
                                   #   非一様・検査体制込み — playbook §5.2)
    exploratory_variance_count: ~  # 探索層の分散次元数(合否外)
    visual_gap_s1_count: ~         # UI-CAD vs 実機の S1(欠落/構造) gap 件数
    visual_gap_s2_count: ~         # UI-CAD vs 実機の S2(設計言語) gap 件数
    design_system_gap_causes: ~    # design_system_part_missing / design_system_not_applied / display_contract_gap / visual_manufacturing_miss
    defect_escape_count: ~         # 固定オラクル/探索/自己受入を抜け、ユーザー確認・後工程で見つかった欠陥
    defect_escape_causes: ~        # spec_omission / bom_sync_gap / oracle_gap / design_system_part_missing / display_contract_gap / manufacturing_miss / harness_bug の内訳
    # フォワード固有(playbook §9)
    g3_dryrun_questions: ~         # G3 ドライランが検出した質問数 → 製造開始可否(blocker 質問ゼロ・§4.6)
    # user_rulings は ECO-055 で削除 — 裁定は 10/20/K-BOM への書き戻しが正本で、件数は導出可能な転写値(§13)
    # 時間測定(transfer-02 還元 2026-07-10)。秒単位の整数を正規値とし、表示時に時間・分へ変換する。
    # ブロック全体に provenance: observed を付ける方式は採らない — タイムスタンプ自体は観測値だが、
    # 人間待ち・環境処理などへの分類は派生値だからである。
    timing:
      wall_clock_s: ~               # セッション開始から終了までの観測経過秒

      union_duration_s:             # 各分類内で重複区間を union した時間
        human_response_wait: ~
        machine_active: ~
        unclassified: ~

      activity_span_sum_s:          # 並列活動を含む延べ時間。wall_clock を超え得る
        model_inference: ~
        test_exec: ~
        env_overhead: ~

      self_reported_s: ~            # 自己申告値が存在する場合のみ記録

      measurement:
        source_artifact: ~          # 対象トランスクリプトまたは分解記録
        tool: method/tools/time-decomposition.py
        tool_revision: ~
        classification_revision: ~
        timestamp_provenance: observed
        component_derivation: classified
        overlap_policy: union_within_class__cross_class_not_additive
    note: ""
